<g fill="#D0926B" font-family="Montserrat,Arial,sans-serif" font-size="28"><text x="90" y="110">A</text><text x="950" y="110">B</text><text x="90" y="505">C</text><text x="950" y="505">D</text></g>
<g stroke="#D0926B"><path d="M82 130h40M942 130h40M82 525h40M942 525h40"/></g>
