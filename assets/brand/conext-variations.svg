<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" role="img" aria-labelledby="t d">
<title id="t">Quatro variações da marca CO NEXT</title><desc id="d">Variações A, B, C e D da assinatura CO NEXT com linha de conexão, pulso central e selo</desc>
<rect width="1800" height="900" fill="#050505"/>
<defs>
<g id="word">
<text x="0" y="0" fill="#F4F0EB" font-family="Montserrat,Helvetica Neue,Arial,sans-serif" font-size="106" font-weight="200" letter-spacing="15">CO NE</text>
<text x="504" y="0" fill="#F4F0EB" font-family="Montserrat,Helvetica Neue,Arial,sans-serif" font-size="106" font-weight="200" letter-spacing="15">T</text>
<path d="M420-85l76 96M496-85l-76 96" fill="none" stroke="#F4F0EB" stroke-width="3"/>
<g fill="none" stroke="#D0926B" stroke-width="1.5"><path d="M458-55v46M435-32h46M442-48l32 32M474-48l-32 32"/></g>
</g>
