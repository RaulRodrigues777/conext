<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 760" role="img" aria-labelledby="title desc">
<title id="title">Evolução da conexão até o infinito</title><desc id="desc">Cinco estágios mostram C e O aproximando-se, conectando-se, cruzando-se e formando o infinito</desc>
<rect width="1800" height="760" rx="34" fill="#0A0908"/>
